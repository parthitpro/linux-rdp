name: Ubuntu Official GNOME RDP

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: 'Paste fresh Chrome Remote Desktop Auth Command'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Desktop & Official Ubuntu Customizations
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            ubuntu-desktop-minimal \
            gnome-terminal \
            yaru-theme-gnome-shell \
            yaru-theme-gtk \
            yaru-theme-icon \
            ubuntu-wallpapers \
            ubuntu-wallpapers-noble \
            fonts-ubuntu \
            fonts-firacode \
            fonts-dejavu-core \
            gnome-shell-extension-desktop-icons-ng \
            dbus-x11

      - name: Pre-Configure GNOME Defaults (Dark Mode, Fonts, Wallpaper, Desktop Icons)
        run: |
          # Apply dark theme and Ubuntu fonts
          gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
          gsettings set org.gnome.desktop.interface gtk-theme 'Yaru-dark'
          gsettings set org.gnome.desktop.interface monospace-font-name 'Ubuntu Mono 13'
          
          # Set official Ubuntu wallpaper
          gsettings set org.gnome.desktop.background picture-uri 'file:///usr/share/backgrounds/Numbat_wallpaper_light_3480x2160.png'
          gsettings set org.gnome.desktop.background picture-uri-dark 'file:///usr/share/backgrounds/Numbat_wallpaper_dimmed_3480x2160.png'
          gsettings set org.gnome.desktop.background picture-options 'zoom'
          
          # Enable desktop icons
          gnome-extensions enable ding@rastersoft.com || true

      - name: Download & Install Chrome Remote Desktop
        run: |
          wget https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo dpkg --install chrome-remote-desktop_current_amd64.deb || sudo apt-get install -f -y

      - name: Configure GNOME Session for CRD
        run: |
          sudo bash -c 'echo "exec /etc/X11/Xsession /usr/bin/gnome-session" > /etc/chrome-remote-desktop-session'

      - name: Start Chrome Remote Desktop Host
        run: |
          ${{ github.event.inputs.crd_code }} --pin=123456

      - name: Keep-Alive Loop
        run: |
          echo "Ubuntu GNOME RDP is active! PIN is: 123456"
          sleep 21600
