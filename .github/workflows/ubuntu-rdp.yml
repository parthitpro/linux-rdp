name: Ubuntu xrdp with Tailscale

on:
  workflow_dispatch:
    inputs:
      tailscale_auth_key:
        description: 'Paste your Tailscale Auth Key'
        required: true
      user_password:
        description: 'Set password for runner user'
        required: true
        default: 'P@ssw0rd123'

jobs:
  rdp:
    runs-on: ubuntu-latest
    steps:
      - name: Install Desktop and xrdp
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            xfce4 xfce4-terminal desktop-base xorg dbus-x11 x11-xserver-utils xrdp
          sudo adduser xrdp ssl-cert

          # Configure user session for XFCE
          cat << 'EOF' > /home/runner/.xsession
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          exec dbus-launch --exit-with-session startxfce4
          EOF
          chmod +x /home/runner/.xsession
          chown runner:runner /home/runner/.xsession

          # Direct xrdp startup to user .xsession
          cat << 'EOF' | sudo tee /etc/xrdp/startwm.sh
          #!/bin/sh
          if [ -r /etc/default/locale ]; then
            . /etc/default/locale
            export LANG LANGUAGE
          fi
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          exec /home/runner/.xsession
          EOF
          sudo chmod +x /etc/xrdp/startwm.sh

          sudo systemctl restart xrdp

      - name: Set Runner User Password
        run: |
          echo "runner:${{ github.event.inputs.user_password }}" | sudo chpasswd

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ""
          oauth-secret: ""
          authkey: ${{ github.event.inputs.tailscale_auth_key }}
          hostname: github-ubuntu-rdp

      - name: Keep Runner Active
        run: |
          echo "Tailscale is connected!"
          tailscale ip -4
          sleep 21600
